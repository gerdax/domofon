<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#151515">
  <meta name="description" content="Dotknij klawiatury. Interaktywny domofon z dźwiękami, dostępny także offline.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Domofon</title>
  <link rel="manifest" href="./manifest.webmanifest?v=18">
  <link rel="icon" href="./assets/key-icon-192.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/key-icon-180.png">
  <link rel="stylesheet" href="./style.css?v=18">
  <script type="module" src="./app.js?v=18"></script>
</head>
<body>
  <main aria-label="Interaktywny domofon">
    <div class="panel" id="panel">
      <img class="photograph" src="./assets/panel.png" alt="Czarny panel domofonu Proel KDC 1905M" draggable="false" width="1116" height="944">
      <svg id="display" class="display" viewBox="0 0 310 120" aria-hidden="true"></svg>
      <div id="keypad" class="keypad" role="group" aria-label="Klawiatura domofonu"></div>
    </div>
    <p id="status" class="sr-only" role="status" aria-live="polite">Domofon gotowy.</p>
  </main>
  <noscript>Włącz JavaScript, aby korzystać z klawiatury i dźwięków domofonu.</noscript>
</body>
</html>
